name: Release

on:
  release:
    types: [ published ]

concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: {% raw %}${{ github.event.release.tag_name }}{% endraw %}
          fetch-depth: 0  # Required for hatch-vcs to generate full version
          fetch-tags: true

      - name: Cache pre-commit hooks
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: {% raw %}pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}{% endraw %}

      - name: Set up Python + Environment
        uses: ./.github/actions/setup-python-env

      - name: Run code quality checks
        run: make check

  tests:
    runs-on: {% raw %}${{ matrix.os }}{% endraw %}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: {% raw %}${{ github.event.release.tag_name }}{% endraw %}
          fetch-depth: 0  # Required for hatch-vcs to generate full version
          fetch-tags: true

      - name: Set up Python + Environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: {% raw %}${{ matrix.python-version }}{% endraw %}

      - name: Run tests
        run: make test

  publish:
    needs: [ quality, tests ]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: {% raw %}${{ github.event.release.tag_name }}{% endraw %}
          fetch-depth: 0  # Required for hatch-vcs to generate full version
          fetch-tags: true

      - name: Set up Python + Environment
        uses: ./.github/actions/setup-python-env

      - name: Verify release tag matches package version
        run: make check-version
        env:
          RELEASE_TAG: {% raw %}${{ github.event.release.tag_name }}{% endraw %}

      - name: Download artifacts verified by the tag workflow
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --pattern '*.whl' \
            --pattern '*.tar.gz' \
            --dir dist
        env:
          GH_TOKEN: {% raw %}${{ github.token }}{% endraw %}
          RELEASE_TAG: {% raw %}${{ github.event.release.tag_name }}{% endraw %}

      - name: Recheck downloaded artifacts
        run: make check-dist

      - name: Publish verified artifacts to PyPI
        run: make publish
        env:
          PYPI_TOKEN: {% raw %}${{ secrets.PYPI_TOKEN }}{% endraw %}
